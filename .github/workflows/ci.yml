# Every push and pull request, as three parallel jobs, each under its own 30-minute limit (A16's
# per-page browser matrix took one combined job past 30 minutes): `check` = typecheck plus unit and
# integration tests (workerd through wrangler's test harness, no Cloudflare account); `e2e` = Plan 1's
# browser tests without its macOS-only screenshots, in 2 shards; `sites` = the sites Worker's browser tests over
# https. Third-party actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main, "plan*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Plan 1's browser tests in 2 shards (25 of 30 minutes as one job). playwright.config.ts sets fullyParallel,
  # so each shard gets an even share of the tests, not whole files (playwright.dev/docs/test-sharding).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      # Customer hostnames are <slug>.localhost; make sure every engine resolves the e2e ones on Linux
      # (apps/sites/e2e/global-setup.ts seeds e2e-<design>-<fixture> for every design and fixture).
      - run: |
          hosts="media.localhost www.localhost"
          for design in impact refined modern; do
            for fixture in plumber-austin hvac-phoenix roofing-extreme cleaning-minimal electrical-xss; do
              hosts="$hosts e2e-$design-$fixture.localhost"
            done
          done
          echo "127.0.0.1 $hosts" | sudo tee -a /etc/hosts
      # Plan 1's screenshot baselines are named *-darwin.png, so Linux ignores them; every other check runs.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2 --ignore-snapshots

  sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      # Customer hostnames are <slug>.localhost; make sure every engine resolves the e2e ones on Linux
      # (apps/sites/e2e/global-setup.ts seeds e2e-<design>-<fixture> for every design and fixture, and
      # e2e-life-<design>-<engine> for the lifecycle tests).
      - run: |
          hosts="media.localhost www.localhost"
          for design in impact refined modern; do
            for fixture in plumber-austin hvac-phoenix roofing-extreme cleaning-minimal electrical-xss; do
              hosts="$hosts e2e-$design-$fixture.localhost"
            done
            for engine in chromium webkit; do
              hosts="$hosts e2e-life-$design-$engine.localhost"
            done
          done
          echo "127.0.0.1 $hosts" | sudo tee -a /etc/hosts
      - run: pnpm test:e2e:sites
