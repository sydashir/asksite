# Every push and pull request: typecheck, unit + integration tests (workerd through wrangler's test
# harness, no Cloudflare account), Plan 1's browser tests without its macOS-only screenshots, and
# the sites Worker's browser tests over https. Third-party actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main, "plan*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      # Customer hostnames are <slug>.localhost; make sure every engine resolves the e2e ones on Linux
      # (apps/sites/e2e/global-setup.ts seeds e2e-<design>-<fixture> for every design and fixture).
      - run: |
          hosts="media.localhost www.localhost"
          for design in impact refined modern; do
            for fixture in plumber-austin hvac-phoenix roofing-extreme cleaning-minimal electrical-xss; do
              hosts="$hosts e2e-$design-$fixture.localhost"
            done
          done
          echo "127.0.0.1 $hosts" | sudo tee -a /etc/hosts
      # Plan 1's screenshot baselines are named *-darwin.png, so Linux ignores them; every other check runs.
      - run: pnpm test:e2e --ignore-snapshots
      - run: pnpm test:e2e:sites

  # The owner app's and the admin app's browser suites and the browser-floor check. Runs in parallel with
  # `check`. Each Playwright config's own webServer builds the e2e Worker (build:css, build:e2e, local D1
  # migrations) and serves it over https with vite preview on 8787 (app) and 8788 (admin); the two suites
  # run one after the other. Needs no secret: the e2e builds use the committed test vars and fakes.
  # The app and admin vitest files (test/**/*.test.ts) are the same files the root `unit` and `workerd`
  # projects in `check` already run, so they are not run again here.
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:css
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      - run: pnpm exec playwright install --with-deps firefox
      # The apps are served from app.localhost and admin.localhost (the e2e Worker configs also name
      # media.localhost and mail.localhost); make sure every engine resolves them on Linux.
      - run: echo "127.0.0.1 app.localhost admin.localhost media.localhost mail.localhost" | sudo tee -a /etc/hosts
      - run: pnpm --filter @asksite/app test:e2e
      - run: pnpm --filter @asksite/admin test:e2e
      - run: pnpm --filter @asksite/app check:floor
